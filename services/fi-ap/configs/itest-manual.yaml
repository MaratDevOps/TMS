# Конфигурация для ручного прогона TestGenerateAndPublishPaymentDemand.
# Параметры сценария совпадают с internal/app/integration_test.go.

postgres:
  dsn: "postgres://fiap:fiap@localhost:5432/fiap?sslmode=disable"

kafka:
  brokers:
    - "localhost:9092"
  topic: "payment.demand"
  producerSystem: "SAP_FI"

metrics:
  listen: ":9090"

generation:
  activeScenario: itest

  referenceData:
    companyCodes: ["1000"]
    counterpartyIds: ["0001007788"]
    currencies: ["RUB"]
    paymentMethods: ["BANK_TRANSFER"]
    statuses: ["CREATED"]
    originDocumentTypes: ["MIRO"]

  scenarios:
    itest:
      positionCount: 3
      parallelThreads: 2
      randomSeed: 1001
      positionsPerDocument: 10
      baseDocumentDate: 2026-01-01
      originDocumentShare: 1.0
      amount:
        min: "100.00"
        max: "1000.00"
      dueDays:
        min: 1
        max: 30
      paymentBlockProbability: 0
      paymentPurposeTemplate: "Оплата по FI-позиции %s"
      stopOnError: true

outboxPublisher:
  enabled: true
  workers: 2
  batchSize: 10
  pollInterval: 50ms
  claimTransactionTimeout: 5s
  lockTimeout: 15s
  kafkaSendTimeout: 10s
  maxAttempts: 5
  retry:
    initialInterval: 100ms
    multiplier: 2.0
    maxInterval: 1s
    jitter: 0
  shutdownTimeout: 10s
