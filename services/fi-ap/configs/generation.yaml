postgres:
  dsn: "postgres://fiap:fiap@localhost:5432/fiap?sslmode=disable"

kafka:
  brokers:
    - "localhost:9092"
  topic: "payment.demand"
  producerSystem: "SAP_FI"

metrics:
  listen: ":9090"

generation:
  activeScenario: smoke

  referenceData:
    companyCodes: ["1000"]
    counterpartyIds: ["0001007788"]
    currencies: ["RUB"]
    paymentMethods: ["BANK_TRANSFER"]
    statuses: ["CREATED"]
    originDocumentTypes: ["MIRO"]

  scenarios:
    smoke:
      positionCount: 10
      parallelThreads: 1
      randomSeed: 1001
      positionsPerDocument: 10
      baseDocumentDate: 2026-01-01
      originDocumentShare: 1.0
      amount:
        min: "100.00"
        max: "1000000.00"
      dueDays:
        min: 1
        max: 30
      paymentBlockProbability: 0.05
      paymentPurposeTemplate: "Оплата по FI-позиции %s"
      stopOnError: true

    parallel-load:
      positionCount: 10000
      parallelThreads: 8
      randomSeed: 2001
      positionsPerDocument: 10
      baseDocumentDate: 2026-01-01
      originDocumentShare: 0.8
      amount:
        min: "100.00"
        max: "1000000.00"
      dueDays:
        min: 1
        max: 30
      paymentBlockProbability: 0.05
      paymentPurposeTemplate: "Оплата по FI-позиции %s"
      stopOnError: false

outboxPublisher:
  enabled: true
  workers: 8
  batchSize: 100
  pollInterval: 500ms
  claimTransactionTimeout: 5s
  lockTimeout: 30s
  kafkaSendTimeout: 10s
  maxAttempts: 5
  retry:
    initialInterval: 1s
    multiplier: 2.0
    maxInterval: 60s
    jitter: 0.20
  shutdownTimeout: 30s
